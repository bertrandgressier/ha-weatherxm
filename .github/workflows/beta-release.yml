name: "Beta Release"

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.1.0"
        with:
          fetch-depth: 0

      - name: "Calculate next beta version"
        id: next_version
        run: |
          BUMP="${{ inputs.version_bump }}"
          
          # Get latest stable release tag (excluding beta)
          LATEST_STABLE=$(git tag -l | grep -v beta | grep -E '^[0-9]' | sort -V | tail -1)
          echo "Latest stable: $LATEST_STABLE"
          
          # Get latest beta tag
          LATEST_BETA=$(git tag -l "*-beta*" | sort -V | tail -1)
          echo "Latest beta: $LATEST_BETA"
          
          if [ -z "$LATEST_BETA" ]; then
            # No beta exists, create first beta from latest stable + bump
            BASE_VERSION="${LATEST_STABLE#v}"
            
            if [ "$BUMP" = "major" ]; then
              NEW_VERSION=$(echo $BASE_VERSION | awk -F. '{print $1+1".0.0"}')
            elif [ "$BUMP" = "minor" ]; then
              NEW_VERSION=$(echo $BASE_VERSION | awk -F. '{$2++; print $1"."$2".0"}')
            else
              NEW_VERSION=$(echo $BASE_VERSION | awk -F. '{$3++; print $1"."$2"."$3"}')
            fi
            NEW_VERSION="${NEW_VERSION}-beta.1"
          else
            # Beta exists, increment or bump version
            BASE_VERSION=$(echo $LATEST_BETA | sed 's/-beta\.[0-9]*$//' | sed 's/^v//')
            BETA_NUM=$(echo $LATEST_BETA | sed 's/.*-beta\.\([0-9]*\)$/\1/')
            
            # Check if we need to start from latest stable
            STABLE_VERSION="${LATEST_STABLE#v}"
            
            # Compare versions
            HIGHER_BASE=$(printf "$BASE_VERSION\n$STABLE_VERSION\n" | sort -V | tail -1)
            
            if [ "$HIGHER_BASE" != "$BASE_VERSION" ] || [ "$BUMP" != "patch" ]; then
              # Stable is higher or user requested bump
              if [ "$BUMP" = "major" ]; then
                BASE_VERSION=$(echo $STABLE_VERSION | awk -F. '{print $1+1".0.0"}')
              elif [ "$BUMP" = "minor" ]; then
                BASE_VERSION=$(echo $STABLE_VERSION | awk -F. '{$2++; print $1"."$2".0"}')
              else
                BASE_VERSION=$(echo $STABLE_VERSION | awk -F. '{$3++; print $1"."$2"."$3"}')
              fi
              BETA_NUM=1
            else
              BETA_NUM=$((BETA_NUM + 1))
            fi
            NEW_VERSION="${BASE_VERSION}-beta.${BETA_NUM}"
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: "Create and push tag"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.next_version.outputs.tag }} -m "Beta release ${{ steps.next_version.outputs.version }}"
          git push origin ${{ steps.next_version.outputs.tag }}

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          name: ${{ steps.next_version.outputs.version }}
          body: |
            ## Beta Release ${{ steps.next_version.outputs.version }}
            
            ${{ inputs.release_notes }}
            
            **⚠️ This is a beta release for testing purposes.**
          prerelease: true
          draft: false
